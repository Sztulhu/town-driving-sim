<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Town Driving Sim</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#10151b;font-family:Arial;color:#fff}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}.panel{position:absolute;background:#0009;border:1px solid #ffffff44;border-radius:10px;padding:10px}#hud{left:16px;top:16px;min-width:190px}#damage{right:16px;top:16px;min-width:150px}#help{left:16px;bottom:16px}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#071018cc;z-index:3}#menu section{background:#121b25;padding:28px;border-radius:16px;text-align:center;box-shadow:0 12px 60px #000}button{padding:12px 18px;margin:6px;border:0;border-radius:8px;background:#2a9d8f;color:#fff;font-weight:bold;cursor:pointer}button:hover{background:#40c5b4}.bar{height:8px;background:#333;border-radius:5px;margin:4px 0 8px}.fill{height:100%;background:#35d07f;border-radius:5px}.warn{color:#ffcc42}.danger{color:#ff595e}small{opacity:.8}</style>
</head>
<body><div id="menu"><section><h1>Town Driving Sim</h1><p>Válassz járművet</p><button data-car="sedan">Compact Sedan</button><button data-car="sport">Low Sports Car</button><button data-car="suv">Mid-size SUV</button><p><small>WASD / nyilak: vezetés · Space: kézifék · R: újraindítás</small></p></section></div><div id="ui"><div id="hud" class="panel"></div><div id="damage" class="panel"></div><div id="help" class="panel">WASD / nyilak · Space kézifék · R reset</div></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b9d0);scene.fog=new THREE.Fog(0x91b9d0,180,520);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,800);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x445544,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(100,180,80);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.78});const road=mat(0x30343a),side=mat(0xb9b7a8),grass=mat(0x5c8c55),wall=mat(0xd8b48b),roof=mat(0x7c4b42),glass=mat(0x315a72);
function box(x,y,z,m,p=0){const o=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),m);o.position.y=y/2;o.castShadow=o.receiveShadow=true;if(p) o.rotation.y=p;scene.add(o);return o}
box(500,.2,500,grass);
for(let i=-2;i<=2;i++){box(500,.06,10,road);box(10,.07,500,road);box(500,.1,1.2,side);box(1.2,.1,500,side)}
function building(x,z){const w=8+Math.random()*12,d=8+Math.random()*12,h=4+Math.random()*7;const b=box(w,h,d,wall);b.position.set(x,h/2,z);const r=box(w+1,1,d+1,roof);r.position.set(x,h+.5,z);for(const s of [-1,1]){const win=box(1.4,1.3,.08,glass);win.position.set(x+s*(w/3),h*.55,z-d/2-.05)} }
for(let x=-100;x<=100;x+=25)for(let z=-100;z<=100;z+=25)if(Math.random()>.28)building(x+(Math.random()-.5)*7,z+(Math.random()-.5)*7);
for(let i=0;i<70;i++){const t=new THREE.Group();const trunk=box(.45,2,.45,mat(0x68452c));const crown=new THREE.Mesh(new THREE.SphereGeometry(2.2,8,6),mat(0x2d713b));crown.position.y=4;t.add(trunk,crown);t.position.set((Math.random()-.5)*230,0,(Math.random()-.5)*230);scene.add(t)}
const specs={sedan:{name:'Sedan',color:0x3d82d6,mass:1,acc:18,max:32,grip:1},sport:{name:'Sport',color:0xd43d46,mass:.75,acc:27,max:45,grip:.86},suv:{name:'SUV',color:0x424b55,mass:1.35,acc:13,max:27,grip:1.08}};let car,kind,vel=0,heading=0,damage=0,wanted=0,police=[],traffic=[];const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function vehicle(s,pol=false){const g=new THREE.Group();const body=box(2.2,.75,4.3,mat(pol?0x183a90:s.color));body.position.y=1;g.add(body);const cabin=box(1.75,.7,2.1,glass);cabin.position.set(0,1.65,-.15);g.add(cabin);for(const x of [-1,1])for(const z of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),mat(0x151515));w.rotation.z=Math.PI/2;w.position.set(x*1.05,.45,z);g.add(w)}if(pol){const light=box(1.3,.15,.35,mat(0x2277ff));light.position.y=2.1;g.add(light)}g.traverse(o=>{o.castShadow=true});scene.add(g);return g}
function reset(){if(car)scene.remove(car);kind='sedan';car=vehicle(specs[kind]);car.position.set(0,0,20);vel=0;heading=0;damage=0;wanted=0;police.forEach(x=>scene.remove(x));traffic.forEach(x=>scene.remove(x));police=[];traffic=[];for(let i=0;i<8;i++){const a=vehicle(specs.sedan);a.position.set((Math.random()-.5)*180,0,(Math.random()-.5)*180);a.userData.dir=Math.random()*Math.PI*2;traffic.push(a)}document.getElementById('menu').style.display='none'}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{kind=b.dataset.car;reset();});
function update(dt){if(!car)return;const s=specs[kind];const forward=keys.w||keys.arrowup,back=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;if(forward)vel+=s.acc*dt;if(back)vel-=s.acc*dt*1.25;vel*=Math.pow(.985,dt*60);if(keys[' '])vel*=Math.pow(.93,dt*60);vel=THREE.MathUtils.clamp(vel,-12,s.max*(1-damage*.55));const steer=(left?-1:0)+(right?1:0);heading+=steer*dt*(.9+Math.abs(vel)/18)*Math.sign(vel||1)*s.grip;car.rotation.y=heading;car.position.x+=Math.sin(heading)*vel*dt;car.position.z+=Math.cos(heading)*vel*dt;car.position.x=THREE.MathUtils.clamp(car.position.x,-235,235);car.position.z=THREE.MathUtils.clamp(car.position.z,-235,235);for(const a of traffic){a.position.x+=Math.sin(a.userData.dir)*dt*5;a.position.z+=Math.cos(a.userData.dir)*dt*5;if(Math.abs(a.position.x)>230||Math.abs(a.position.z)>230)a.userData.dir+=Math.PI/2;const d=a.position.distanceTo(car.position);if(d<3){damage=Math.min(1,damage+.18);vel*=-.35;wanted=Math.min(100,wanted+25)}}if(wanted>55&&police.length<2){const p=vehicle(specs.sedan,true);p.position.copy(car.position).add(new THREE.Vector3(20,0,20));police.push(p)}for(const p of police){const dx=car.position.x-p.position.x,dz=car.position.z-p.position.z;const ang=Math.atan2(dx,dz);p.rotation.y=ang;p.position.x+=Math.sin(ang)*dt*(8+wanted/12);p.position.z+=Math.cos(ang)*dt*(8+wanted/12);if(p.position.distanceTo(car.position)<4){wanted=100;vel*=.7}}wanted=Math.max(0,wanted-dt*(vel<8?3:.25));const kmh=Math.round(Math.abs(vel)*3.6);document.getElementById('hud').innerHTML=`<b>${s.name}</b><br>${kmh} km/h<br><span class="${kmh>50?'warn':''}">Limit: 50 km/h</span><br>Wanted: <span class="${wanted>60?'danger':''}">${Math.round(wanted)}%</span>`;document.getElementById('damage').innerHTML=`<b>Damage</b><br>Body<div class="bar"><div class="fill" style="width:${(1-damage)*100}%"></div></div>Engine<div class="bar"><div class="fill" style="width:${(1-damage*.8)*100}%"></div></div><small>${damage>.7?'SEVERE DAMAGE':'Operational'}</small>`;camera.position.lerp(new THREE.Vector3(car.position.x-Math.sin(heading)*10,7,car.position.z-Math.cos(heading)*10),.08);camera.lookAt(car.position.x,1,car.position.z)}
let last=performance.now();function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}loop(last);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
